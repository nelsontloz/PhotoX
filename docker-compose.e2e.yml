# Self-contained app stack for the e2e suite, merged over the infra-only
# docker-compose.yml (postgres + redis) by e2e/run.sh — hence the full
# core/worker-service/web definitions here, not just overrides.
services:
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: photox-e2e-core:latest
    environment:
      NODE_ENV: production
      API_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: photox
      POSTGRES_PASSWORD: photox_dev
      POSTGRES_DB: photox
      STORAGE_DIR: /data/storage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-photox_dev}
      AUTH_ACCESS_TTL: 30m
      AUTH_REFRESH_TTL: 1d
      AUTH_TOKEN_SECRET: dev-auth-secret-32-characters-minimum!!
      WORKER_JWT_SECRET: dev-worker-secret-32-characters-minimum!!
      # e2e registers many users from one IP; prod/dev keep the default of 10/hour
      RATE_LIMIT_REGISTER: 1000
      # seeded admin (open registration only mints 'user'): core inserts this admin on
      # bootstrap when no admin exists — the e2e suite logs in as it
      ADMIN_EMAIL: admin@photox.test
      ADMIN_PASSWORD: password123
      # per-user backup S3 (Floci): in-Compose endpoint for server-side ops, host
      # endpoint unused here (no presigns); e2e-only bucket keeps dev/prod apart
      S3_ENDPOINT: http://floci:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_BACKUP_BUCKET: photox-e2e-backups
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - photox-net

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    image: photox-e2e-worker-service:latest
    environment:
      NODE_ENV: production
      WORKER_SERVICE_PORT: 3004
      CORE_URL: http://core:3000
      STORAGE_DIR: /data/storage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-photox_dev}
      AUTH_TOKEN_SECRET: dev-auth-secret-32-characters-minimum!!
      WORKER_JWT_SECRET: dev-worker-secret-32-characters-minimum!!
    volumes:
      - storage-data:/data/storage
      - ./data/storage/models:/data/storage/models:ro
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - photox-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: photox-e2e-web:latest
    ports:
      - '127.0.0.1:${E2E_WEB_PORT:-5273}:5173'
    environment:
      VITE_API_URL: http://core:3000
    depends_on:
      core:
        condition: service_healthy
    networks:
      - photox-net

  # keep the e2e stack isolated from the host
  postgres:
    ports: !override []

  redis:
    ports: !override []

  # Floci S3 for per-user backup e2e (same image/env as the infra base compose);
  # no healthcheck exists on the base service, so core gates on service_started.
  # Ports unpublished — parallel e2e runs must not contend on host :4566.
  floci:
    image: floci/floci:latest
    ports: !override []
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

# declared here (not in the infra-only base compose) — only the e2e stack mounts it
volumes:
  storage-data:
