name: photox_mobile
description: "PhotoX mobile auto-upload app (iOS + Android)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  background_downloader: ^9.6.4
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  photo_manager: ^3.12.0
  video_player: ^2.14.1
  wakelock_plus: ^1.8.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the on-device e2e suite (`pnpm mobile:e2e`); ships with the SDK.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
