services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg16-bookworm
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: photox
      POSTGRES_PASSWORD: photox_dev
      POSTGRES_DB: photox
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photox']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - photox-net

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - photox-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: photox
      POSTGRES_PASSWORD: photox_dev
      POSTGRES_DB: photox
      STORAGE_DIR: /data/storage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_ACCESS_TTL: 30m
      AUTH_REFRESH_TTL: 30d
      AUTH_TOKEN_SECRET: dev-auth-secret-32-characters-minimum!!
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - photox-net

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      WORKER_SERVICE_PORT: 3004
      STORAGE_DIR: /data/storage
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - photox-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - photox-net

volumes:
  pgdata:
  storage-data:

networks:
  photox-net:
    driver: bridge
