services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg16-bookworm
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: photox
      POSTGRES_PASSWORD: photox_dev
      POSTGRES_DB: photox
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photox']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - photox-net

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-photox_dev}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-photox_dev}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - photox-net

volumes:
  pgdata:
  storage-data:

networks:
  photox-net:
    driver: bridge
