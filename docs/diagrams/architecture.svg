<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">How PhotoX fits together</title>
        <desc id="architecture-desc">Architecture diagram of PhotoX: the browser loads the Vite web app, which proxies /api to the NestJS core API; core owns Postgres and enqueues to Redis for a worker whose jobs call back over HTTP, while a shared local disk holds every file.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #eb6c36;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ARROWS (drawn before boxes) ============ -->

        <!-- Browser -> Web app -->
        <line x1="176" y1="128" x2="248" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Web app -> Core API (same-origin /api proxy, HTTP) -->
        <line x1="392" y1="128" x2="480" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

        <!-- Core API -> Postgres -->
        <line x1="680" y1="128" x2="752" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Core API -> Redis (enqueue) -->
        <line x1="580" y1="160" x2="580" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Redis -> Worker Service (consume) -->
        <line x1="652" y1="312" x2="736" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Worker Service -> Core API (loopback: every job is an HTTP call) -->
        <path d="M 824,280 V 256 Q 824,248 816,248 H 638 Q 630,248 630,240 V 160"
              fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-link)"/>

        <!-- Core API -> Local Disk -->
        <path d="M 530,160 V 192 Q 530,200 522,200 H 344 Q 336,200 336,208 V 416"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Worker Service -> Local Disk -->
        <path d="M 824,344 V 372 Q 824,380 816,380 H 632 Q 624,380 624,388 V 416"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- ============ ARROW LABELS ============ -->
        <rect x="400" y="108" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="117" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROXIES /API</text>

        <rect x="704" y="108" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

        <rect x="530" y="211" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="550" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>

        <rect x="691" y="228" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="727" y="237" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELEGATED JWT</text>

        <!-- ============ EDITORIAL CALLOUTS ============ -->
        <text x="48" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">core owns the database — everything else talks HTTP</text>
        <path d="M 392 68 Q 470 80 540 92" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="544" cy="96" r="2" fill="#2d3142"/>

        <text x="48" y="502" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">no object store — both services share this disk</text>
        <path d="M 352 496 Q 376 490 398 483" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="402" cy="480" r="2" fill="#4f5d75"/>

        <!-- ============ NODES ============ -->

        <!-- Browser (input) -->
        <rect x="48" y="96" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="96" width="128" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="56" y="102" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="70" y="111" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="112" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
        <text x="112" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user session</text>

        <!-- Web app (backend) -->
        <rect x="248" y="96" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="248" y="96" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="256" y="102" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="270" y="111" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="320" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web app</text>
        <text x="320" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vite + React · :5173</text>

        <!-- Core API (focal) -->
        <rect x="480" y="96" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="96" width="200" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="488" y="102" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="502" y="111" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="580" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core API</text>
        <text x="580" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NestJS · :3000 · sole HTTP API</text>

        <!-- Postgres (store) -->
        <rect x="752" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="96" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="760" y="102" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="774" y="111" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="832" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
        <text x="832" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">photox · pgvector</text>

        <!-- Redis (store) -->
        <rect x="508" y="280" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="508" y="280" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="516" y="286" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="536" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
        <text x="580" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
        <text x="580" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BullMQ · 7 queues</text>

        <!-- Worker Service (backend) -->
        <rect x="736" y="280" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="280" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="744" y="286" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="760" y="295" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOBS</text>
        <text x="824" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker Service</text>
        <text x="824" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no DB access</text>

        <!-- Local Disk (store) -->
        <rect x="48" y="416" width="864" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="416" width="864" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="56" y="422" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="72" y="431" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="480" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local Disk</text>
        <text x="480" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">STORAGE_DIR · originals · thumbs · transcodes</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="522" x2="920" y2="522" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="112" y="548" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <text x="132" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client / UI</text>

        <rect x="210" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

        <rect x="290" y="548" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="310" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

        <rect x="384" y="548" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="404" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core hub</text>

        <line x1="470" y1="553" x2="498" y2="553" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <text x="506" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>

        <line x1="576" y1="553" x2="604" y2="553" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <text x="612" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

        <line x1="688" y1="553" x2="716" y2="553" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow-link)"/>
        <text x="724" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async return</text>
      </svg>
